<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Theme store graphics</title>
<!-- Rendered by render.ps1: ?g=icon (512x512), ?g=feature (1024x500), ?g=banner (1280x720). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: #050505; color: #f4f4f4; font-family: "Segoe UI", sans-serif; }
  .g { display: none; position: relative; overflow: hidden; }
  .stripes {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 65% 60% at 100% 100%, rgba(212,175,55,.38), transparent 70%),
      linear-gradient(90deg, rgba(5,5,5,.97) 0%, rgba(5,5,5,.82) 48%, rgba(5,5,5,.5) 100%),
      repeating-linear-gradient(90deg, #050505 0 var(--s), #e9e9e9 var(--s) calc(var(--s) * 2));
  }
  .badge { border: solid #d4af37; background: repeating-linear-gradient(90deg, #111 0 var(--b), #f4f4f4 var(--b) calc(var(--b) * 2)); }
  .word { font-family: Bahnschrift, "Segoe UI", sans-serif; font-weight: 700; text-transform: uppercase; }
  .gold { color: #d4af37; }

  /* App icon: just the badge on black, bold enough to read at 48 px. */
  #icon { width: 512px; height: 512px; background: #000; }
  #icon .badge { position: absolute; left: 76px; top: 76px; width: 360px; height: 360px;
                 border-width: 18px; border-radius: 72px; --b: 54px; }

  /* Feature graphic: wordmark and tagline over stripes. */
  #feature { width: 1024px; height: 500px; --s: 64px; }
  #feature .row { position: absolute; left: 72px; top: 150px; display: flex; align-items: center; gap: 36px; }
  #feature .badge { width: 160px; height: 160px; border-width: 8px; border-radius: 32px; --b: 24px; }
  #feature .name { font-size: 96px; line-height: .9; }
  #feature .tag { font-size: 28px; letter-spacing: .16em; margin-top: 14px; }

  /* TV banner: what the TV shows in its app list. Text big and centered-left. */
  #banner { width: 1280px; height: 720px; --s: 80px; }
  #banner .row { position: absolute; left: 110px; top: 200px; display: flex; align-items: center; gap: 56px; }
  #banner .badge { width: 280px; height: 280px; border-width: 12px; border-radius: 52px; --b: 40px; }
  #banner .name { font-size: 150px; line-height: .88; }
</style>
</head>
<body>
<div class="g" id="icon"><div class="badge"></div></div>

<div class="g" id="feature">
  <div class="stripes"></div>
  <div class="row">
    <div class="badge"></div>
    <div>
      <div class="word name">TV<br>Theme</div>
      <div class="word tag gold">Black, white &amp; gold</div>
    </div>
  </div>
</div>

<div class="g" id="banner">
  <div class="stripes"></div>
  <div class="row">
    <div class="badge"></div>
    <div class="word name">TV<br><span class="gold">Theme</span></div>
  </div>
</div>

<script>
  const g = new URLSearchParams(location.search).get("g") || "feature";
  document.getElementById(g).style.display = "block";
</script>
</body>
</html>
